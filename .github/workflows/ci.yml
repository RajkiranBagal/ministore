name: CI

# When to run this pipeline: on every push to main, and on every PR into main.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest # a fresh Linux VM GitHub spins up for us

    # The build (and `prisma generate`) need DATABASE_URL present. The build
    # doesn't actually connect to the DB — it just needs the var to exist.
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}

    steps:
      # 1. Pull your repo code into the VM.
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Install Node, and cache npm downloads between runs for speed.
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # 3. Install dependencies exactly from package-lock.json (reproducible).
      - name: Install dependencies
        run: npm ci

      # 4-6. The actual quality gates. If any fails, the whole run fails
      #      and the commit/PR is flagged with a red X.
      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

  # Runs ONLY after `verify` succeeds (needs: verify) and ONLY on main.
  # If lint/test/build fail, this job never runs → no deploy of broken code.
  deploy:
    needs: verify
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to Vercel (production)
        run: npx vercel deploy --prod --yes --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
