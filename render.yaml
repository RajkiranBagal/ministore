# Render Blueprint for the FastAPI recommendations service.
# https://render.com/docs/blueprint-spec
services:
  - type: web
    name: ministore-recommendations
    runtime: python
    plan: free
    rootDir: services/recommendations
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.13"
      - key: DATABASE_URL
        sync: false # set this secret in the Render dashboard
      - key: ALLOWED_ORIGINS
        value: "https://ministore-pi.vercel.app,http://localhost:3000"
